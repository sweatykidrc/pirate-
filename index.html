<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pirate Camp Radar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0e14;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 6px; color: #ff6b6b; }
    .subtitle { color: #8b949e; margin-bottom: 24px; font-size: 0.95rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: end;
    }
    label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
    input, button {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input { width: 280px; max-width: 100%; }
    button {
      background: #238636;
      border-color: #2ea043;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      font-size: 0.9rem;
    }
    .status.error { border-color: #f85149; color: #f85149; }
    .status.ok { border-color: #3fb950; color: #3fb950; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.9rem;
    }
    th, td {
      padding: 11px 13px;
      text-align: left;
      border-bottom: 1px solid #21262d;
    }
    th {
      background: #0d1117;
      color: #8b949e;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
    }
    tr:hover { background: #1c2128; }
    .profit { color: #3fb950; font-weight: 600; }
    .volume { color: #58a6ff; }
    .commodity { color: #ffa657; }
    .empty { text-align: center; padding: 40px; color: #8b949e; }
    .debug {
      margin-top: 18px;
      padding: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #8b949e;
      white-space: pre-wrap;
      max-height: 180px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pirate Camp Radar</h1>
    <p class="subtitle">High value + real traffic routes</p>

    <div class="controls">
      <div>
        <label>UEX API Token</label>
        <input type="password" id="token" placeholder="Paste token here" />
      </div>
      <button id="loadBtn" onclick="loadRoutes()">Load Routes</button>
    </div>

    <div id="status" class="status" style="display:none;"></div>
    <div id="results"><div class="empty">Paste token and hit Load Routes</div></div>
    <div id="debug" class="debug" style="display:none;"></div>
  </div>

  <script>
    // Different proxy that usually handles Authorization better
    const PROXY = "https://api.allorigins.win/raw?url=";
    const API = "https://api.uexcorp.uk/2.0";

    async function loadRoutes() {
      const token = document.getElementById("token").value.trim();
      const btn = document.getElementById("loadBtn");
      const results = document.getElementById("results");
      const debug = document.getElementById("debug");

      if (!token) {
        showStatus("Paste your token first", true);
        return;
      }

      btn.disabled = true;
      showStatus("Loading...", false);
      results.innerHTML = `<div class="empty">Working...</div>`;
      debug.style.display = "none";

      try {
        // Test the commodities list first
        const testUrl = PROXY + encodeURIComponent(API + "/commodities");
        const testRes = await fetch(testUrl, {
          headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
          }
        });

        const testText = await testRes.text();
        let testJson;
        try {
          testJson = JSON.parse(testText);
        } catch (e) {
          throw new Error("Proxy returned non-JSON. Response starts with: " + testText.slice(0, 120));
        }

        if (testJson.status !== "ok" || !testJson.data) {
          throw new Error("Token rejected or API error: " + (testJson.message || testJson.status || "unknown"));
        }

        // We got commodities – now pull routes from the first 25
        const commodities = testJson.data.slice(0, 25);
        let allRoutes = [];

        for (const c of commodities) {
          try {
            const routeUrl = PROXY + encodeURIComponent(API + "/commodities_routes?id_commodity=" + c.id);
            const r = await fetch(routeUrl, {
              headers: {
                "Authorization": "Bearer " + token,
                "Accept": "application/json"
              }
            });
            const j = await r.json();
            if (j.status === "ok" && Array.isArray(j.data)) {
              j.data.forEach(route => {
                allRoutes.push({
                  ...route,
                  commodity_name: c.name || ("ID " + c.id)
                });
              });
            }
          } catch (e) {
            // skip individual failures
          }
        }

        // Dedupe
        const seen = new Set();
        allRoutes = allRoutes.filter(r => {
          const key = `${r.id_commodity}-${r.id_terminal_origin}-${r.id_terminal_destination}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });

        // Loose filter
        let routes = allRoutes.filter(r => {
          const trips = (r.price_origin_users_rows || 0) + (r.price_destination_users_rows || 0);
          const margin = r.price_margin || 0;
          return margin > 30 || trips >= 1;
        });

        // Sort by value + traffic
        routes.sort((a, b) => {
          const scoreA = (a.price_margin || 0) * 8 + ((a.price_origin_users_rows || 0) + (a.price_destination_users_rows || 0));
          const scoreB = (b.price_margin || 0) * 8 + ((b.price_origin_users_rows || 0) + (b.price_destination_users_rows || 0));
          return scoreB - scoreA;
        });

        routes = routes.slice(0, 40);

        // Debug
        debug.style.display = "block";
        debug.textContent = `Commodities loaded: ${testJson.data.length}\nRoutes pulled: ${allRoutes.length}\nAfter filter: ${routes.length}`;

        if (routes.length === 0) {
          results.innerHTML = `<div class="empty">No routes after filtering. Check debug info.</div>`;
          showStatus("No matching routes", true);
          return;
        }

        let html = `<table>
          <thead>
            <tr>
              <th>Commodity</th>
              <th>Origin → Dest</th>
              <th>Profit / SCU</th>
              <th>Traffic</th>
            </tr>
          </thead>
          <tbody>`;

        for (const r of routes) {
          const trips = (r.price_origin_users_rows || 0) + (r.price_destination_users_rows || 0);
          const margin = Math.round(r.price_margin || 0);
          html += `<tr>
            <td class="commodity">${r.commodity_name}</td>
            <td>${r.id_terminal_origin || "?"} → ${r.id_terminal_destination || "?"}</td>
            <td class="profit">${margin.toLocaleString()}</td>
            <td class="volume">${trips}</td>
          </tr>`;
        }

        html += `</tbody></table>`;
        results.innerHTML = html;
        showStatus(`Showing ${routes.length} routes`, false);

      } catch (err) {
        console.error(err);
        results.innerHTML = `<div class="empty">Error</div>`;
        showStatus(err.message, true);
        debug.style.display = "block";
        debug.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function showStatus(msg, isError) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.textContent = msg;
      el.className = "status " + (isError ? "error" : "ok");
    }

    // Remember token
    const saved = localStorage.getItem("uex_token");
    if (saved) document.getElementById("token").value = saved;
    document.getElementById("token").addEventListener("change", e => {
      localStorage.setItem("uex_token", e.target.value.trim());
    });
  </script>
</body>
</html>
